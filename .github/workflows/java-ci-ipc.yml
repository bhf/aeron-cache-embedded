name: Java CI (Aeron gateway, IPC)

# Mirrors java-ci.yml but exercises the Aeron gateway's IPC transport media instead of UDP: the
# backend and this job's test JVM share one media driver directory (no network endpoints). Runs as a
# separate workflow so it executes in parallel with java-ci.yml.

on:
  push:
    branches: [ main ]
    paths:
      - 'libraries/java/**'
      - '.github/workflows/java-ci-ipc.yml'
  pull_request:
    paths:
      - 'libraries/java/**'
      - '.github/workflows/java-ci-ipc.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: libraries/java
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Set up Homebrew
        run: |
          echo "/home/linuxbrew/.linuxbrew/bin" >> $GITHUB_PATH
          eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"

      - name: Install Aeron Cache Backend
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
          HOMEBREW_NO_REQUIRE_TAP_TRUST: "1"
        run: |
          eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          # `brew tap` can exit non-zero with "Broken pipe" (Homebrew EPIPE) even when the tap is
          # fetched successfully, so it is best-effort here; the install below is the real gate.
          set +e
          brew tap bhf/aeroncache > tap.log 2>&1
          tap_rc=$?
          brew install --verbose aeron-cache > install.log 2>&1
          inst_rc=$?
          if [ "$inst_rc" -ne 0 ]; then
            echo "::group::tap.log (exit $tap_rc)"; cat tap.log; echo "::endgroup::"
            echo "::group::install.log (exit $inst_rc)"; cat install.log; echo "::endgroup::"
            exit 1
          fi
          echo "Aeron Cache backend installed (tap exit $tap_rc, install exit $inst_rc)."

      - name: Start Aeron Cache Backend (IPC gateway)
        env:
          AERON_GATEWAY_ENABLED: "true"
          GATEWAY_TRANSPORT_MEDIA: "ipc"
          # An absolute path keeps this unambiguous regardless of each step's/process's working
          # directory. The backend embeds its own media driver here; the test JVM below shares it.
          AERON_DIR: ${{ github.workspace }}/.aeron-ipc
        run: |
          echo "AERON_DIR=$AERON_DIR" >> $GITHUB_ENV

          nohup aeron-cache > aeron-cache-log.txt 2>&1 &
          ENV_FILE="$HOME/.aeron-cache/aeron-cache-ui.env"

          for i in {1..30}; do
            if [ -f "$ENV_FILE" ]; then
              echo "Environment file found"
              break
            fi
            echo "Waiting for $ENV_FILE..."
            sleep 1
          done
          if [ ! -f "$ENV_FILE" ]; then
            echo "Error: $ENV_FILE not found after timeout"
            exit 1
          fi

          # The embedded media driver writes cnc.dat into AERON_DIR once it's up; wait for it so the
          # IPC client below doesn't race the driver's own startup.
          for i in {1..30}; do
            if [ -f "$AERON_DIR/cnc.dat" ]; then
              echo "Aeron IPC media driver ready at $AERON_DIR"
              break
            fi
            echo "Waiting for $AERON_DIR/cnc.dat..."
            sleep 1
          done
          if [ ! -f "$AERON_DIR/cnc.dat" ]; then
            echo "Error: $AERON_DIR/cnc.dat not found after timeout"
            exit 1
          fi

          echo "::group::Aeron Gateway status (from backend logs)"
          grep -iE "gateway" "$HOME/.aeron-cache/aeron-cache.log" aeron-cache-log.txt \
            || echo "(no gateway lines in backend logs)"
          echo "::endgroup::"

      - name: Build and test (Aeron gateway IPC integration tests)
        # -Daeron.gateway.ipc.it=true enables AeronGatewayClientIpcIntegrationTest against the gateway
        # started above, sharing its media driver at $AERON_DIR (read from the environment). The UDP
        # gateway IT (aeron.gateway.it) stays disabled here — that's java-ci.yml's job.
        run: ./gradlew build -Daeron.gateway.ipc.it=true
