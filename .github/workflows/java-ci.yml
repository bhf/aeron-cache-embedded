name: Java CI

on:
  push:
    branches: [ main ]
    paths:
      - 'libraries/java/**'
      - '.github/workflows/java-ci.yml'
  pull_request:
    paths:
      - 'libraries/java/**'
      - '.github/workflows/java-ci.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: libraries/java
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Set up Homebrew
        run: |
          echo "/home/linuxbrew/.linuxbrew/bin" >> $GITHUB_PATH
          eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
      
      - name: Install Aeron Cache Backend
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
          HOMEBREW_NO_REQUIRE_TAP_TRUST: "1"
        run: |
          eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          # Homebrew (Ruby) aborts with "Error: Broken pipe" when it gets EPIPE
          # writing progress to the runner's log pipe. Send its output to a
          # regular file instead (a file never triggers EPIPE); surface the
          # captured logs only if a command actually fails.
          set +e
          # `brew tap` can exit non-zero with "Broken pipe" (Homebrew EPIPE) even when the tap is
          # fetched successfully, so it is best-effort here; the install below is the real gate and
          # auto-taps if needed. Only the install's exit code fails the step.
          brew tap bhf/aeroncache > tap.log 2>&1
          tap_rc=$?
          brew install --verbose aeron-cache > install.log 2>&1
          inst_rc=$?
          if [ "$inst_rc" -ne 0 ]; then
            echo "::group::tap.log (exit $tap_rc)"; cat tap.log; echo "::endgroup::"
            echo "::group::install.log (exit $inst_rc)"; cat install.log; echo "::endgroup::"
            exit 1
          fi
          echo "Aeron Cache backend installed (tap exit $tap_rc, install exit $inst_rc)."

      - name: Start Aeron Cache Backend
        env:
          # Enable the Aeron SBE gateway so the Aeron transport integration tests can connect.
          AERON_TRANSPORT_GATEWAY_ENABLED: "true"
        run: |
          nohup aeron-cache > aeron-cache-log.txt 2>&1 &
          ENV_FILE="$HOME/.aeron-cache/aeron-cache-ui.env"
          
          for i in {1..30}; do
            if [ -f "$ENV_FILE" ]; then
              echo "Environment file found"
              break
            fi
            echo "Waiting for $ENV_FILE..."
            sleep 1
          done
          
          if [ -f "$ENV_FILE" ]; then
            FULL_API=$(grep "^AERON_CACHE_API=" "$ENV_FILE" | cut -d'=' -f2- | tr -d '\r' | tr -d '"')
            BASE_URL=$(echo "$FULL_API" | sed -E 's|(https?://[^/]+).*|\1|')
            
            FULL_WS=$(grep "^AERON_CACHE_WS_API=" "$ENV_FILE" | cut -d'=' -f2- | tr -d '\r' | tr -d '"')
            # Handle potential missing slashes like ws:localhost:7071
            if [[ "$FULL_WS" == ws:* && "$FULL_WS" != ws://* ]]; then
              FULL_WS="${FULL_WS/ws:/ws:\/\/}"
            fi
            WS_URL=$(echo "$FULL_WS" | sed -E 's|(wss?://[^/]+).*|\1|')
            
            echo "Found Base API URL: $BASE_URL"
            echo "Found Base WS URL: $WS_URL"
            echo "AERON_CACHE_BASE_URL=$BASE_URL" >> $GITHUB_ENV
            echo "AERON_CACHE_WS_URL=$WS_URL" >> $GITHUB_ENV
          else
            echo "Error: $ENV_FILE not found after timeout"
            exit 1
          fi
          
      - name: Build and test
        # -Daeron.gateway.it=true enables the Aeron gateway integration tests against the gateway
        # started above (default host 127.0.0.1, ports 7075/7076).
        run: ./gradlew build -Daeron.gateway.it=true
