name: Rust CI

on:
  push:
    branches: [ main ]
    paths:
      - 'libraries/rust/**'
      - '.github/workflows/rust-ci.yml'
  pull_request:
    paths:
      - 'libraries/rust/**'
      - '.github/workflows/rust-ci.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: libraries/rust
    steps:
      - uses: actions/checkout@v4

      # rusteron-client builds the Aeron C client via cmake and generates bindings with bindgen,
      # so a C toolchain, cmake and libclang are required. rusteron-media-driver (used by the
      # gateway integration tests) additionally builds the Aeron media driver, which links libbsd
      # and libuuid.
      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install -y clang libclang-dev cmake libbsd-dev uuid-dev

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - name: Build
        run: cargo build --verbose

      - name: Set up Homebrew
        run: |
          echo "/home/linuxbrew/.linuxbrew/bin" >> $GITHUB_PATH
          eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"

      - name: Install Aeron Cache Backend
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
          HOMEBREW_NO_REQUIRE_TAP_TRUST: "1"
        run: |
          eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          # `brew tap` can exit non-zero with "Broken pipe" (Homebrew EPIPE) even when the tap is
          # fetched successfully, so it is best-effort here; the install below is the real gate.
          set +e
          brew tap bhf/aeroncache > tap.log 2>&1
          tap_rc=$?
          brew install --verbose aeron-cache > install.log 2>&1
          inst_rc=$?
          if [ "$inst_rc" -ne 0 ]; then
            echo "::group::tap.log (exit $tap_rc)"; cat tap.log; echo "::endgroup::"
            echo "::group::install.log (exit $inst_rc)"; cat install.log; echo "::endgroup::"
            exit 1
          fi
          echo "Aeron Cache backend installed (tap exit $tap_rc, install exit $inst_rc)."

      - name: Start Aeron Cache Backend
        env:
          # Enable the Aeron SBE gateway and pin its endpoints to loopback for the gateway
          # integration tests.
          AERON_TRANSPORT_GATEWAY_ENABLED: "true"
          GATEWAY_REQUEST_ENDPOINT: "127.0.0.1:7075"
          GATEWAY_RESPONSE_CONTROL_ENDPOINT: "127.0.0.1:7076"
        run: |
          nohup aeron-cache > aeron-cache-log.txt 2>&1 &
          ENV_FILE="$HOME/.aeron-cache/aeron-cache-ui.env"

          for i in {1..30}; do
            if [ -f "$ENV_FILE" ]; then
              echo "Environment file found"
              break
            fi
            echo "Waiting for $ENV_FILE..."
            sleep 1
          done

          if [ -f "$ENV_FILE" ]; then
            FULL_API=$(grep "^AERON_CACHE_API=" "$ENV_FILE" | cut -d'=' -f2- | tr -d '\r' | tr -d '"')
            BASE_URL=$(echo "$FULL_API" | sed -E 's|(https?://[^/]+).*|\1|')

            FULL_WS=$(grep "^AERON_CACHE_WS_API=" "$ENV_FILE" | cut -d'=' -f2- | tr -d '\r' | tr -d '"')
            if [[ "$FULL_WS" == ws:* && "$FULL_WS" != ws://* ]]; then
              FULL_WS="${FULL_WS/ws:/ws:\/\/}"
            fi
            WS_URL=$(echo "$FULL_WS" | sed -E 's|(wss?://[^/]+).*|\1|')

            echo "Found Base API URL: $BASE_URL"
            echo "Found Base WS URL: $WS_URL"
            echo "AERON_CACHE_BASE_URL=$BASE_URL" >> $GITHUB_ENV
            echo "AERON_CACHE_WS_URL=$WS_URL" >> $GITHUB_ENV
          else
            echo "Error: $ENV_FILE not found after timeout"
            exit 1
          fi

      - name: Run tests
        run: cargo test --verbose

      - name: Run Aeron gateway integration tests
        # Each test launches its own embedded media driver; run them sequentially.
        env:
          AERON_GATEWAY_IT: "true"
          AERON_GATEWAY_HOST: "127.0.0.1"
        run: cargo test --test gateway_integration_tests -- --test-threads=1
